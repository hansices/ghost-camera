<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#111111"><title>Ghost Camera</title><style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font:16px system-ui;max-width:700px;margin:auto;padding: max(12px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:20px}button,.pick,a{font:inherit;background:#303030;color:white;border:0;border-radius:12px;padding:12px;text-decoration:none;display:inline-block}button:disabled{opacity:.4}#stage{position:relative;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:62dvh;margin:auto;touch-action:none}video{width:100%;height:100%;object-fit:contain;display:block}#ghost{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;transform-origin:center;opacity:.5}#grid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,transparent 33%,#ffffff55 33%,#ffffff55 33.3%,transparent 33.3%,transparent 66%,#ffffff55 66%,#ffffff55 66.3%,transparent 66.3%),linear-gradient(to bottom,transparent 33%,#ffffff55 33%,#ffffff55 33.3%,transparent 33.3%,transparent 66%,#ffffff55 66%,#ffffff55 66.3%,transparent 66.3%)}.row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0}input[type=range]{flex:1;accent-color:white;min-width:100px}#shutter{border:4px solid white;border-radius:50%;width:70px;height:70px;background:#fff;box-shadow:inset 0 0 0 4px #111}#status{font-size:13px;color:#ccc;text-align:center;min-height:20px}#result{width:100%;max-height:55vh;object-fit:contain}dialog{background:#222;color:white;border:0;border-radius:16px;width:95%;max-width:600px}dialog::backdrop{background:#000b}[hidden]{display:none!important}
body{max-width:none;padding:0;height:100dvh;overflow:hidden}#stage{position:absolute;inset:0;width:100%;height:100%;max-height:none;aspect-ratio:auto!important}header{position:absolute;z-index:2;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;gap:8px}h1{font-size:15px;text-shadow:0 1px 5px black}button,.pick,a,select{background:#161616bb;color:white;padding:9px;border:0;border-radius:10px;font:inherit}#controls{position:absolute;bottom:max(8px,env(safe-area-inset-bottom));left:10px;right:10px;z-index:2;background:#1118;border-radius:16px;padding:6px;max-width:600px;margin:auto}#controls .row{margin:5px 0;gap:7px}#controls button,.pick{font-size:13px}#status{margin:4px 0;font-size:11px;min-height:0}#shutter{width:58px;height:58px}#cameraSelect{max-width:48vw;font-size:12px}#extras{padding:3px}#extras summary{font-size:12px;text-align:center;cursor:pointer}#ghost{object-fit:contain}dialog .row{margin:12px 0}
</style></head><body><header><h1>Ghost Camera</h1><select id="cameraSelect" aria-label="Camera lens" hidden></select><button id="start">Start camera</button></header><div id="stage"><video id="video" autoplay muted playsinline></video><img id="ghost" hidden alt="Reference overlay"><div id="grid" hidden></div></div><div id="controls"><div class="row"><label class="pick">Choose reference<input id="file" type="file" accept="image/*" hidden></label><button id="toggle" disabled>Hide overlay</button></div><div class="row"><label for="opacity">Opacity</label><input id="opacity" type="range" min="0" max="100" value="50"><span id="percent">50%</span></div><details id="extras"><summary>Overlay tools</summary><div class="row"><button id="gridBtn">Grid</button><button id="reset">Reset overlay</button><button id="lock">Lock overlay</button></div></details><div class="row"><button id="shutter" aria-label="Take photograph" disabled></button></div><p id="status" role="status">Start the camera and choose a reference photo.</p></div><dialog id="review"><img id="result" alt="Captured photograph"><div class="row"><button id="share">Share / Save</button><a id="download" download="ghost-camera.jpg">Download</a><button id="close">Retake</button></div><p>On iPhone, use Share / Save and choose Save Image if available, or touch and hold the photograph.</p></dialog><script>
const $=id=>document.getElementById(id),v=$('video'),g=$('ghost'),stage=$('stage');let stream,refURL,resultURL,blob,x=0,y=0,scale=1,locked=false,visible=true;const status=s=>$('status').textContent=s;function transform(){g.style.transform=`translate(${x}px,${y}px) scale(${scale})`;}function reset(){x=y=0;scale=1;transform()}function visibility(){g.hidden=!refURL||!visible;$('toggle').textContent=visible?'Hide overlay':'Show overlay'}
const selector=$('cameraSelect');let busy=false;
async function listCameras(){const devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');const current=stream?.getVideoTracks()[0]?.getSettings().deviceId;selector.replaceChildren(new Option('Auto rear camera',''));devices.forEach((d,i)=>selector.add(new Option(d.label||`Camera ${i+1}`,d.deviceId)));selector.value=devices.some(d=>d.deviceId===current)?current:'';selector.hidden=devices.length===0;}
async function startCamera(id=''){if(busy)return;if(!navigator.mediaDevices?.getUserMedia){status('Camera access requires HTTPS in Safari.');return}busy=true;selector.disabled=true;$('start').disabled=true;$('shutter').disabled=true;try{stream?.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{...(id?{deviceId:{exact:id}}:{facingMode:{ideal:'environment'}}),width:{ideal:3840},height:{ideal:2160},aspectRatio:{ideal:4/3}}});v.srcObject=stream;await v.play();$('shutter').disabled=false;$('start').textContent='Restart';status('Camera ready.');try{await listCameras()}catch(e){status('Camera ready; lens list unavailable.')}}catch(e){status('Camera unavailable: '+e.message)}finally{busy=false;selector.disabled=false;$('start').disabled=false}}
$('start').onclick=()=>startCamera(selector.value);selector.onchange=()=>startCamera(selector.value);

$('file').onchange=()=>{const f=$('file').files[0];if(!f)return;const url=URL.createObjectURL(f);const test=new Image();test.onload=()=>{if(refURL)URL.revokeObjectURL(refURL);refURL=url;g.src=url;visible=true;reset();visibility();$('toggle').disabled=false;status('Drag or pinch the reference to adjust it. Move the phone to align.');};test.onerror=()=>{URL.revokeObjectURL(url);status('Could not open this image. Try a JPEG or PNG.')};test.src=url;$('file').value=''};
$('opacity').oninput=()=>{g.style.opacity=$('opacity').value/100;$('percent').textContent=$('opacity').value+'%'};$('toggle').onclick=()=>{visible=!visible;visibility()};$('gridBtn').onclick=()=>{$('grid').hidden=!$('grid').hidden};$('reset').onclick=()=>{if(!locked)reset()};$('lock').onclick=()=>{locked=!locked;$('lock').textContent=locked?'Unlock overlay':'Lock overlay';$('reset').disabled=locked;points.clear();last=null};
const points=new Map();let last=null;function geometry(){const p=[...points.values()];if(!p.length)return null;if(p.length===1)return {x:p[0].x,y:p[0].y,d:0,n:1};return{x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2,d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),n:2}}stage.onpointerdown=e=>{if(locked||!refURL||!visible)return;stage.setPointerCapture(e.pointerId);points.set(e.pointerId,{x:e.clientX,y:e.clientY});last=geometry()};stage.onpointermove=e=>{if(!points.has(e.pointerId)||locked)return;points.set(e.pointerId,{x:e.clientX,y:e.clientY});const a=geometry();if(last&&a.n===last.n){const old=scale;if(a.d&&last.d)scale=Math.max(.25,Math.min(8,scale*a.d/last.d));const r=stage.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;x=a.x-cx-(last.x-cx-x)*scale/old;y=a.y-cy-(last.y-cy-y)*scale/old;transform()}last=a};function end(e){points.delete(e.pointerId);last=geometry()}stage.onpointerup=end;stage.onpointercancel=end;stage.onlostpointercapture=end;
$('shutter').onclick=()=>{if(!v.videoWidth)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);c.toBlob(b=>{if(!b){status('Capture failed. Try again.');return}blob=b;if(resultURL)URL.revokeObjectURL(resultURL);resultURL=URL.createObjectURL(b);$('result').src=resultURL;$('download').href=resultURL;$('review').showModal();status(`Captured ${c.width} × ${c.height} pixels.`)},'image/jpeg',.97)};$('close').onclick=()=>$('review').close();$('share').onclick=async()=>{if(!blob)return;const f=new File([blob],'ghost-camera-'+Date.now()+'.jpg',{type:'image/jpeg'});try{if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f]});else alert('Use Download or touch and hold the photograph to save it.')}catch(e){if(e.name!=='AbortError')alert('Sharing unavailable. Use Download instead.')}};window.addEventListener('pagehide',()=>{stream?.getTracks().forEach(t=>t.stop());$('shutter').disabled=true});</script></body></html>
